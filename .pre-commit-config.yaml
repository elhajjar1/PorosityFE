# Run the same lint and type checks as the CI "lint" job before each commit:
#   pip install -e ".[dev]" pre-commit && pre-commit install
# The hooks use the tools from your environment (language: system), so they
# match the versions `pip install -e ".[dev]"` gives CI. CI's mypy job pins
# numpy<2; install that locally too if mypy reports numpy-stub errors.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy porosity_fe porosity_fe_analysis.py
        language: system
        types: [python]
        pass_filenames: false
