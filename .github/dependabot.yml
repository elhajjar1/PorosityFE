# Dependency updates (issue #220). The workflow actions are pinned by commit
# SHA with the version in a comment; Dependabot moves both. The pip
# ecosystem covers the ranges in pyproject.toml (core and the web, dev and
# docs extras). The `numpy<2` pin of the CI lint job is a workflow command,
# not a manifest entry, so it stays as it is.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: deps
