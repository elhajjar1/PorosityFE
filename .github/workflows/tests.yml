name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install package and lint tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        # mypy's type-check contract here was validated against numpy 1.x
        # stubs; numpy 2.x ships stricter shape/dtype stubs that surface
        # unrelated errors. Pin the lint env only — runtime stays unpinned.
        pip install "numpy<2"

    - name: Ruff
      run: ruff check .

    - name: Mypy
      # Post-#119 the implementation lives in porosity_fe/; the legacy
      # `porosity_fe_analysis.py` is now a 62-line shim. Check the package.
      run: mypy porosity_fe porosity_fe_analysis.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install package
      # Editable install so the tests exercise the real packaging (entry
      # points, py-modules, package data) instead of a sys.path shim.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
      run: pytest tests/ -v --tb=short

    - name: Run tests with coverage
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
      env:
        # Also run the production-mesh FE timing guard on this one cell
        # (tests/test_fe_performance.py; generous budgets, see the module).
        POROSITY_FE_BENCHMARK: "1"
      # Statements and branches together; the floor (95 %) sits about a
      # point below the measured total, so a drop fails the cell (#219).
      run: >-
        pytest tests/ -v --tb=short
        --cov=porosity_fe --cov=validation --cov-branch
        --cov-report=term-missing:skip-covered --cov-report=xml
        --cov-fail-under=95

    - name: Upload coverage report
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: coverage-xml
        path: coverage.xml

  fe_fingerprint:
    # FE result regression gate (issue #214): recomputes the gate set of
    # scripts/fingerprint.py (30 production and defect cases, single
    # threaded) and compares it with the committed baseline at rtol 1e-9.
    # BLAS thread counts and numpy / scipy releases move the results by
    # about 1e-14, so a failure means the results changed. A deliberate
    # change regenerates scripts/fingerprint_baseline.json in the same PR
    # and says why in the CHANGELOG (see the script's docstring).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install package with the baseline's numpy and scipy
      # Some gate fields are round-off through and through (the reactions
      # of the self-equilibrated DCB, the mode II / III rates of its pure
      # mode I front), and other wheels change them; see the script's
      # docstring. Regenerating the baseline moves these pins.
      run: |
        python -m pip install --upgrade pip
        pins=$(python -c "import json; e = json.load(open('scripts/fingerprint_baseline.json'))['meta']['environment']; print('numpy==' + e['numpy'], 'scipy==' + e['scipy'])")
        echo "pins: $pins"
        pip install -e . $pins

    - name: Compare the FE results with the baseline
      env:
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
      run: python scripts/fingerprint.py --check scripts/fingerprint_baseline.json

  streamlit_smoke:
    # Decoupled from the core matrix so Streamlit wheel availability
    # (especially on Python 3.13) can't drop the whole library matrix red.
    # Pin to a single OS/Python combo that we know has stable Streamlit
    # support; see issue #157.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install package with the web extra
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[web]"

    - name: Smoke-test Streamlit app imports
      run: python -c "import app; print('app imports OK')"
